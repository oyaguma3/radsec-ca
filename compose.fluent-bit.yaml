# ログを管理面の Fluent Bit に送るときに重ねる設定（aka-mvpset の概要 §18.7 の Q6、§13）。
# 管理面の Fluent Bit は aka-provisioner の compose が動かし、ホストのループバック（既定 24224）で受ける。
# タグごとのファイル（radsec-ca.log・radsec-ca-cloudflared.log）は aka-provisioner の configs/fluent-bit/fluent-bit.yaml に書く。
# aka-provisioner を先に起動する（Fluent Bit に届かないと、fluentd-async でコンテナは起動し、ログはバッファーに溜めて送り直す）。
# .env の COMPOSE_FILE に compose.fluent-bit.yaml を足すと有効になる。

x-logging: &fluent-bit-logging
  driver: fluentd
  options: &fluent-bit-options
    fluentd-address: localhost:${PROVISIONER_FLUENT_BIT_PORT:-24224}
    fluentd-async: "true"
    fluentd-buffer-limit: "1048576"

services:
  radsec-ca:
    logging:
      <<: *fluent-bit-logging
      options:
        <<: *fluent-bit-options
        tag: app.radsec-ca

  cloudflared:
    logging:
      <<: *fluent-bit-logging
      options:
        <<: *fluent-bit-options
        tag: app.radsec-ca-cloudflared
