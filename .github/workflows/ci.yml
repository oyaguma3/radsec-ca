# 整形・静的検査・単体の試験を行う。
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# 同じブランチで新しく push したら、古い実行は止める。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: テスト
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: 整形の確認
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt で整形されていないファイル:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: テスト
        run: go test -race -count=1 ./...


  interop:
    name: 相互運用の試験（openssl）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: 相互運用の試験
        env:
          CA_TEST_OPENSSL: "1"
        run: |
          set -o pipefail
          openssl version
          go test -count=1 -v ./... | tee interop.log
          # openssl の試験は CA_TEST_OPENSSL がないとスキップされ、テスト自体は成功してしまうので、別に確かめる。
          if grep -q -- '--- SKIP' interop.log; then
            echo "スキップされた試験があります"
            grep -- '--- SKIP' interop.log
            exit 1
          fi
